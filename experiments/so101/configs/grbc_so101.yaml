# TurboVLA — SO-101 × GR-BC weighted SFT（本番テンプレート）
# 前提:
#   - データ: 2視点(front+wrist)ロールアウトプール。so101-lab docs/26 の①〜③で作成
#     (lerobot-record → add_reward_labels.py で next.reward 付与)
#   - 重み: robot/GR-BC で horizon 12 で export 済みの transition_weights.parquet
#     grbc-export --chunk 12 --n-action-step 12 \
#       --cameras observation.images.front observation.images.wrist \
#       --gripper-threshold 26
#   - data_mix: experiments/so101/data_registry/data_config.py に
#     DATASET_NAMED_MIXTURES["grbc_pool"] = [("<pool_dataset_name>", 1.0, "so101")]
#     を登録してからこの config を使う
#
# 起動 (TurboVLA リポジトリ直下):
#   export PYTHONPATH=/home/kevin/robot/TurboVLA:/home/kevin/robot/TurboVLA/third_party/starvla_runtime
#   export BERT_MODEL_PATH=$HOME/models/bert-base-uncased
#   export DINOV3_MODEL_PATH=$HOME/models/dinov3-vitb16
#   export WANDB_MODE=disabled CUDA_VISIBLE_DEVICES=0
#   .venv310/bin/torchrun --nproc_per_node 1 \
#     third_party/starvla_runtime/starVLA/training/train_turbovla.py \
#     --config_yaml experiments/so101/configs/grbc_so101.yaml

run_id: turbovla_so101_grbc_pool
run_root_dir: /home/kevin/robot/TurboVLA/results/Checkpoints
seed: 1000
wandb_project: TurboVLA_SO101
wandb_entity: local
is_debug: false
version_id: "0.22"

framework:
  name: TurboVLA
  text:
    bert_path: ${oc.env:BERT_MODEL_PATH}
    max_text_len: 256
    sub_sentence_present: true
    local_files_only: true
    freeze_text_encoder: true
    attn_implementation: sdpa
  vision:
    model_path: ${oc.env:DINOV3_MODEL_PATH}
    image_size: 224
    num_views: 2
    local_files_only: true
    freeze_vision_encoder: false
    attn_implementation: sdpa
    position_init_std: 0.01
    position_scale_init: 0.01
    dropout: 0.1
  interaction:
    hidden_dim: 256
    nheads: 8
    dim_feedforward: 2048
    enhancer_inner_dim: 1024
    num_layers: 6
    text_dropout: 0.0
    fusion_dropout: 0.0
    fusion_droppath: 0.1
    padding_strategy: zero_fill
    residual_style: pre_norm
    attention_backend: sdpa
    compute_precision: bf16_autocast
  initialization:
    pretrained_ckpt: ${oc.env:TURBOVLA_INIT_CKPT}
    load_pretrained: true
    load_bert: true
    load_text_projection: true
    load_interaction: true
  action:
    action_dim: 6
    state_dim: 6
    horizon: 12            # GR-BC重みの n_action_step と一致必須（起動時検証あり）
    num_layers: 3
    num_state_tokens: 2
    state_hidden_dim: 256
    mlp_hidden_dim: 512
    dropout: 0.1
    loss_type: l1

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    include_index: true    # GR-BC重みルックアップ用: バッチに global frame index を同梱
    data_root_dir: /home/kevin/robot/datasets
    data_mix: grbc_pool    # data_registry に登録したプールmixture名
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    dataset_sampling_strategy: default
    per_device_batch_size: 8
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: pyav
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true

trainer:
  use_deepspeed: false
  # SO-101適応済みckptから継続（load_pretrained_backbones で全モデル読込）
  pretrained_checkpoint: /home/kevin/robot/TurboVLA/results/Checkpoints/turbovla_so101_cobra_silver_bowl/final_model/pytorch_model.pt
  is_resume: false
  # ポストトレーニングは短めに。データ規模に応じて調整（100ep程度なら2000前後から）
  max_train_steps: 2000
  num_warmup_steps: 100
  save_interval: 500
  eval_interval: 500
  logging_frequency: 10
  learning_rate:
    base: 5.0e-05
    text_encoder: 5.0e-05
    vision_encoder: 5.0e-05
    vision_language_interaction: 5.0e-05
    vision_projection: 5.0e-05
    action_head: 5.0e-05
  lr_scheduler_type: warmup_constant_with_factor
  scheduler_specific_kwargs:
    warmup_start_factor: 0.0
  freeze_modules: text_encoder.bert,vision_encoder.backbone.norm
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  ema_decay: 0.999
  ema_device: cuda
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-10
  save_format: pt
  grbc:
    enable: true
    # robot/GR-BC の export 出力（n_action_step=12 で生成したもの）
    weights_path: /home/kevin/robot/GR-BC/outputs/grbc_pool_h12/transition_weights.parquet
    weight_column: graph_transition_weight
    reduction: mean        # mean | self_normalized
