# TurboVLA — SO-101 silver bowl (2026-10-20 RGB, 6 ep / 1797 fr @ 15fps)
# 現行タスク正本。plastic container 用 cobra_so101.yaml は使わない。
#
# 起動 (TurboVLA リポジトリ直下):
#   export PYTHONPATH=/home/kevin/robot/TurboVLA:/home/kevin/robot/TurboVLA/third_party/starvla_runtime
#   export BERT_MODEL_PATH=$HOME/models/bert-base-uncased
#   export DINOV3_MODEL_PATH=$HOME/models/dinov3-vitb16
#   export TURBOVLA_INIT_CKPT=$HOME/models/groundingdino/groundingdino_swint_ogc.pth
#   export WANDB_MODE=disabled CUDA_VISIBLE_DEVICES=0
#   .venv/bin/torchrun --nproc_per_node 1 \
#     third_party/starvla_runtime/starVLA/training/train_turbovla.py \
#     --config_yaml experiments/so101/configs/cobra_silver_bowl_so101.yaml

run_id: turbovla_so101_cobra_silver_bowl
run_root_dir: /home/kevin/robot/TurboVLA/results/Checkpoints
seed: 1000
wandb_project: TurboVLA_SO101
wandb_entity: local
is_debug: false
version_id: "0.21"

framework:
  name: TurboVLA
  text:
    bert_path: ${oc.env:BERT_MODEL_PATH}
    max_text_len: 256
    sub_sentence_present: true
    local_files_only: true
    freeze_text_encoder: true
    attn_implementation: sdpa
  vision:
    model_path: ${oc.env:DINOV3_MODEL_PATH}
    image_size: 224
    num_views: 2
    local_files_only: true
    freeze_vision_encoder: false
    attn_implementation: sdpa
    position_init_std: 0.01
    position_scale_init: 0.01
    dropout: 0.1
  interaction:
    hidden_dim: 256
    nheads: 8
    dim_feedforward: 2048
    enhancer_inner_dim: 1024
    num_layers: 6
    text_dropout: 0.0
    fusion_dropout: 0.0
    fusion_droppath: 0.1
    padding_strategy: zero_fill
    residual_style: pre_norm
    attention_backend: sdpa
    compute_precision: bf16_autocast
  initialization:
    pretrained_ckpt: ${oc.env:TURBOVLA_INIT_CKPT}
    load_pretrained: true
    load_bert: true
    load_text_projection: true
    load_interaction: true
  action:
    action_dim: 6
    state_dim: 6
    horizon: 12
    num_layers: 3
    num_state_tokens: 2
    state_hidden_dim: 256
    mlp_hidden_dim: 512
    dropout: 0.1
    loss_type: l1

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /home/kevin/.cache/huggingface/lerobot/local
    data_mix: cobra_silver_bowl
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    dataset_sampling_strategy: default
    # 6 ep / 1797 fr — BS を少し下げて epoch 内の更新回数を稼ぐ
    per_device_batch_size: 8
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: pyav
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true

trainer:
  use_deepspeed: false
  # ACT と同オーダー（7000）。~31 epoch @ BS8。実機がダメならデータ追加 → steps 再計算
  max_train_steps: 7000
  num_warmup_steps: 200
  save_interval: 1000
  eval_interval: 1000
  logging_frequency: 50
  learning_rate:
    base: 5.0e-05
    text_encoder: 5.0e-05
    vision_encoder: 5.0e-05
    vision_language_interaction: 5.0e-05
    vision_projection: 5.0e-05
    action_head: 5.0e-05
  lr_scheduler_type: warmup_constant_with_factor
  scheduler_specific_kwargs:
    warmup_start_factor: 0.0
  freeze_modules: text_encoder.bert,vision_encoder.backbone.norm
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  ema_decay: 0.999
  ema_device: cuda
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-10
  save_format: pt
  is_resume: false
