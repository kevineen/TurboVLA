# TurboVLA — SO-101 single-arm cobra task (LeRobot v3.0 curated dataset)
# 単 GPU (4090)・deepspeed なし。起動:
#   PYTHONPATH=/home/kevin/robot/TurboVLA:/home/kevin/robot/TurboVLA/third_party/starvla_runtime \
#   BERT_MODEL_PATH=... DINOV3_MODEL_PATH=... TURBOVLA_INIT_CKPT=... \
#   WANDB_MODE=disabled .venv/bin/python \
#   third_party/starvla_runtime/starVLA/training/train_turbovla.py \
#   --config_yaml experiments/so101/configs/cobra_so101.yaml

run_id: turbovla_so101_cobra
run_root_dir: /home/kevin/robot/TurboVLA/results/Checkpoints
seed: 1000
wandb_project: TurboVLA_SO101
wandb_entity: local
is_debug: false
version_id: "0.21"

framework:
  name: TurboVLA
  text:
    bert_path: ${oc.env:BERT_MODEL_PATH}
    max_text_len: 256
    sub_sentence_present: true
    local_files_only: true
    freeze_text_encoder: true
    attn_implementation: sdpa
  vision:
    model_path: ${oc.env:DINOV3_MODEL_PATH}
    image_size: 224
    num_views: 2
    local_files_only: true
    freeze_vision_encoder: false
    attn_implementation: sdpa
    position_init_std: 0.01
    position_scale_init: 0.01
    dropout: 0.1
  interaction:
    hidden_dim: 256
    nheads: 8
    dim_feedforward: 2048
    enhancer_inner_dim: 1024
    num_layers: 6
    text_dropout: 0.0
    fusion_dropout: 0.0
    fusion_droppath: 0.1
    padding_strategy: zero_fill
    residual_style: pre_norm
    attention_backend: sdpa
    compute_precision: bf16_autocast
  initialization:
    pretrained_ckpt: ${oc.env:TURBOVLA_INIT_CKPT}
    load_pretrained: true
    load_bert: true
    load_text_projection: true
    load_interaction: true
  action:
    action_dim: 6
    state_dim: 6
    horizon: 12
    num_layers: 3
    num_state_tokens: 2
    state_hidden_dim: 256
    mlp_hidden_dim: 512
    dropout: 0.1
    loss_type: l1

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /home/kevin/.cache/huggingface/lerobot/local
    data_mix: cobra
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    dataset_sampling_strategy: default
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: pyav
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true

trainer:
  use_deepspeed: false
  max_train_steps: 20000
  num_warmup_steps: 1000
  save_interval: 2000
  eval_interval: 1000
  logging_frequency: 50
  learning_rate:
    base: 5.0e-05
    text_encoder: 5.0e-05
    vision_encoder: 5.0e-05
    vision_language_interaction: 5.0e-05
    vision_projection: 5.0e-05
    action_head: 5.0e-05
  lr_scheduler_type: warmup_constant_with_factor
  scheduler_specific_kwargs:
    warmup_start_factor: 0.0
  # vision_encoder.backbone.norm は hidden_states[-1] を使う経路では損失に寄与しない
  # （TurboVLA は最終 norm 適用前の特徴を使う）ため DDP の unused param エラー回避も兼ねて凍結
  freeze_modules: text_encoder.bert,vision_encoder.backbone.norm
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  ema_decay: 0.999
  ema_device: cuda
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-10
  save_format: pt
  is_resume: false
